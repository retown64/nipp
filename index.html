<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#b83220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="たこトップ 日報">
<title>たこトップ｜日報システム</title>

<style>
:root{
 --bg:#f7f1e5;
 --card:#fffdf8;
 --ink:#2a241d;
 --muted:#7d7468;
 --line:#e7dcc9;
 --red:#b83220;
 --red2:#d94a32;
 --cream:#fff8e9;
 --green:#287a50;
 --shadow:0 8px 28px rgba(64,39,20,.08)
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent
}

body{
 margin:0;
 background:linear-gradient(180deg,#f6eee0,#fbf8f1);
 color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans",sans-serif
}

button,input,select,textarea{
 font:inherit
}

button{
 cursor:pointer
}

.app{
 max-width:900px;
 margin:auto;
 min-height:100vh;
 padding-bottom:88px
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:rgba(255,253,248,.96);
 backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line);
 padding:12px 16px
}

.header-inner{
 display:flex;
 align-items:center;
 gap:12px;
 max-width:900px;
 margin:auto
}

.logo{
 width:54px;
 height:54px;
 object-fit:contain;
 border-radius:50%;
 background:#fff;
 box-shadow:0 3px 12px rgba(0,0,0,.1)
}

.brand{
 flex:1
}

.brand-title{
 font-weight:900;
 font-size:20px;
 letter-spacing:.02em
}

.brand-sub{
 font-size:11px;
 color:var(--muted);
 margin-top:2px
}

.header-date{
 font-size:12px;
 color:var(--muted);
 text-align:right
}

.view{
 padding:16px
}

.card{
 background:var(--card);
 border:1px solid rgba(199,176,143,.35);
 border-radius:22px;
 padding:18px;
 margin-bottom:14px;
 box-shadow:var(--shadow)
}

.hero{
 background:linear-gradient(135deg,#fffaf0,#f8e8d4);
 overflow:hidden;
 position:relative
}

.hero:after{
 content:"";
 position:absolute;
 width:180px;
 height:180px;
 border-radius:50%;
 background:rgba(184,50,32,.06);
 right:-55px;
 top:-55px
}

.hero-title{
 font-size:25px;
 font-weight:900;
 margin:0 0 5px
}

.hero-text{
 color:var(--muted);
 font-size:13px;
 line-height:1.6
}

.section-title{
 font-size:16px;
 font-weight:900;
 margin:0 0 12px;
 display:flex;
 align-items:center;
 gap:8px
}

.section-title .dot{
 width:9px;
 height:9px;
 border-radius:50%;
 background:var(--red)
}

.field{
 margin-bottom:14px
}

.field:last-child{
 margin-bottom:0
}

label{
 display:block;
 font-size:12px;
 font-weight:900;
 color:#655b4f;
 margin-bottom:7px
}

input,select,textarea{
 width:100%;
 border:1px solid #d8cbb8;
 border-radius:13px;
 background:#fff;
 padding:12px 13px;
 color:var(--ink);
 font-size:16px
}

input:focus,select:focus,textarea:focus{
 outline:3px solid rgba(184,50,32,.12);
 border-color:var(--red)
}

textarea{
 min-height:100px;
 resize:vertical
}

.product-row{
 display:grid;
 grid-template-columns:minmax(0,1.6fr) 110px 110px 44px;
 gap:8px;
 align-items:center;
 margin-bottom:9px
}

.qty{
 display:flex;
 align-items:center;
 border:1px solid #d8cbb8;
 border-radius:13px;
 overflow:hidden;
 background:#fff;
 height:46px
}

.qty button{
 border:0;
 background:#f6eee1;
 width:34px;
 height:100%;
 font-size:21px;
 color:var(--red);
 font-weight:900
}

.qty span{
 flex:1;
 text-align:center;
 font-weight:900
}

.price{
 font-weight:800;
 text-align:right
}

.remove{
 height:46px;
 border:0;
 border-radius:12px;
 background:#fae5e0;
 color:#a6291b;
 font-size:21px
}

.add-product{
 border:1px dashed #d6b59c;
 background:#fff9ef;
 color:var(--red);
 border-radius:12px;
 padding:10px 13px;
 font-weight:900
}

.total-box{
 display:flex;
 justify-content:space-between;
 align-items:end;
 margin-top:15px;
 padding:16px;
 border-radius:16px;
 background:#2f281f;
 color:#fff
}

.total-label{
 font-size:12px;
 opacity:.75
}

.total{
 font-size:30px;
 font-weight:900
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-top:12px
}

.btn{
 border:0;
 border-radius:14px;
 padding:14px;
 font-weight:900
}

.primary{
 background:var(--red);
 color:#fff
}

.secondary{
 background:#eee5d8;
 color:var(--ink)
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px
}

.stat{
 background:#faf4e9;
 border:1px solid var(--line);
 border-radius:15px;
 padding:12px
}

.stat small{
 display:block;
 color:var(--muted);
 font-size:11px
}

.stat strong{
 display:block;
 font-size:20px;
 margin-top:4px
}

.tabs{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-bottom:12px
}

.tab{
 border:0;
 background:#eee5d8;
 color:#6e6356;
 border-radius:11px;
 padding:11px 7px;
 font-weight:900
}

.tab.active{
 background:var(--red);
 color:#fff
}

.filters{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px
}

.report{
 border:1px solid var(--line);
 border-radius:16px;
 padding:14px;
 margin-bottom:9px;
 background:#fff
}

.report-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}

.report-date{
 font-weight:900
}

.report-total{
 font-size:20px;
 font-weight:900;
 color:var(--red)
}

.chips{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:10px
}

.chip{
 background:#f7eee2;
 border-radius:999px;
 padding:6px 9px;
 font-size:12px
}

.comment{
 margin-top:9px;
 color:var(--muted);
 font-size:13px;
 white-space:pre-wrap
}

.report-actions{
 display:flex;
 gap:7px;
 margin-top:11px
}

.report-actions button{
 flex:1;
 border:0;
 border-radius:10px;
 padding:9px;
 font-weight:900
}

.edit{
 background:#eee9e0
}

.delete{
 background:#fae5e0;
 color:#a6291b
}

.master-list{
 display:grid;
 gap:8px
}

.master-item{
 display:grid;
 grid-template-columns:1fr 110px 44px;
 gap:8px;
 align-items:center;
 padding:9px;
 background:#faf6ee;
 border-radius:12px
}

.master-name{
 font-weight:800
}

.master-price{
 text-align:right;
 font-weight:900
}

.master-form{
 display:grid;
 grid-template-columns:1fr 140px 90px;
 gap:8px
}

.danger{
 background:#fae5e0;
 color:#a6291b
}

.empty{
 text-align:center;
 color:var(--muted);
 padding:35px 10px
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 background:rgba(255,253,248,.97);
 backdrop-filter:blur(12px);
 border-top:1px solid var(--line);
 padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom))
}

.bottom-inner{
 max-width:900px;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px
}

.bottom button{
 border:0;
 background:transparent;
 border-radius:12px;
 padding:7px;
 color:#85796a;
 font-size:12px;
 font-weight:900
}

.bottom button.active{
 background:#f3e6d5;
 color:var(--red)
}

.toast{
 position:fixed;
 left:50%;
 bottom:96px;
 transform:translate(-50%,15px);
 background:#2f281f;
 color:#fff;
 border-radius:999px;
 padding:11px 16px;
 font-size:13px;
 opacity:0;
 pointer-events:none;
 transition:.2s;
 z-index:50
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0)
}

@media(max-width:650px){

 .product-row{
  grid-template-columns:minmax(0,1fr) 92px 88px 40px
 }

 .master-form{
  grid-template-columns:1fr 110px 74px
 }

}

@media(max-width:480px){

 .filters{
  grid-template-columns:1fr
 }

 .stats{
  grid-template-columns:1fr 1fr 1fr
 }

 .product-row{
  grid-template-columns:1fr 78px 78px 38px
 }

 .master-form{
  grid-template-columns:1fr 105px 70px
 }

 .hero-title{
  font-size:22px
 }

}
</style>
</head>

<body>

<div class="app">

<header>

<div class="header-inner">

<img class="logo" id="logo" alt="たこトップ">

<div class="brand">
<div class="brand-title">たこトップ 日報</div>
<div class="brand-sub">売上をかんたん記録・管理</div>
</div>

<div class="header-date" id="headerDate"></div>

</div>

</header>


<main id="inputView" class="view">

<section class="card hero">

<h1 class="hero-title">今日の日報を入力</h1>

<div class="hero-text">
商品を選ぶだけで登録済みの単価を自動入力。
数量を入れると売上も自動計算します。
</div>

</section>


<section class="card">

<div class="section-title">
<span class="dot"></span>
基本情報
</div>

<div class="field">

<label>日付</label>

<input id="date" type="date">

</div>


<div class="section-title" style="margin-top:18px">

<span class="dot"></span>
商品・数量

</div>

<div id="products"></div>

<button class="add-product" onclick="addProduct()">
＋ 商品を追加
</button>


<div class="total-box">

<div>

<div class="total-label">
売上合計
</div>

<div style="font-size:12px;opacity:.65">
自動計算
</div>

</div>

<div class="total" id="total">
¥0
</div>

</div>


<div class="field" style="margin-top:14px">

<label>備考</label>

<textarea
 id="comment"
 placeholder="今日の状況、特記事項など"
></textarea>

</div>


<div class="actions">

<button
 class="btn secondary"
 onclick="clearForm()"
>
入力をクリア
</button>

<button
 class="btn primary"
 onclick="saveReport()"
>
日報を登録
</button>

</div>

</section>


<section class="card">

<div class="section-title">
<span class="dot"></span>
今日の集計
</div>

<div class="stats">

<div class="stat">
<small>日報件数</small>
<strong id="todayCount">0件</strong>
</div>

<div class="stat">
<small>売上</small>
<strong id="todaySales">¥0</strong>
</div>

<div class="stat">
<small>商品数</small>
<strong id="todayQty">0個</strong>
</div>

</div>

</section>

</main>


<main id="salesView" class="view" style="display:none">

<section class="card">

<div class="section-title">
<span class="dot"></span>
売上一覧
</div>

<div class="tabs">

<button
 class="tab active"
 id="tabAll"
 onclick="setMode('all')"
>
すべて
</button>

<button
 class="tab"
 id="tabMonth"
 onclick="setMode('month')"
>
月別
</button>

<button
 class="tab"
 id="tabDay"
 onclick="setMode('day')"
>
日別
</button>

</div>


<div class="filters">

<div
 class="field"
 id="monthBox"
 style="display:none"
>

<label>対象月</label>

<input
 id="month"
 type="month"
>

</div>


<div
 class="field"
 id="dayBox"
 style="display:none"
>

<label>対象日</label>

<input
 id="day"
 type="date"
>

</div>

</div>


<button
 class="btn secondary"
 style="width:100%"
 onclick="clearSearch()"
>
検索条件をクリア
</button>

</section>


<section class="card">

<div class="stats">

<div class="stat">
<small>件数</small>
<strong id="listCount">0件</strong>
</div>

<div class="stat">
<small>売上合計</small>
<strong id="listSales">¥0</strong>
</div>

<div class="stat">
<small>商品合計</small>
<strong id="listQty">0個</strong>
</div>

</div>

</section>

<div id="reports"></div>

</main>


<main id="masterView" class="view" style="display:none">

<section class="card">

<div class="section-title">
<span class="dot"></span>
商品マスター
</div>

<div
 style="
 font-size:13px;
 color:var(--muted);
 line-height:1.6;
 margin-bottom:13px
 "
>
ここで商品名と単価を登録すると、
日報入力時に商品名をプルダウンから選ぶだけで
単価が自動表示されます。
</div>


<div class="master-form">

<input
 id="newProductName"
 placeholder="商品名"
>

<input
 id="newProductPrice"
 type="number"
 min="0"
 inputmode="numeric"
 placeholder="単価"
>

<button
 class="btn primary"
 onclick="addMaster()"
>
登録
</button>

</div>

</section>


<section class="card">

<div
 id="masterList"
 class="master-list"
></div>

</section>

</main>


<nav class="bottom">

<div class="bottom-inner">

<button
 id="navInput"
 class="active"
 onclick="showView('input')"
>
✏️
<br>
日報入力
</button>

<button
 id="navSales"
 onclick="showView('sales')"
>
📊
<br>
売上一覧
</button>

<button
 id="navMaster"
 onclick="showView('master')"
>
⚙️
<br>
商品設定
</button>

</div>

</nav>


<div
 id="toast"
 class="toast"
></div>

</div>


<script>

const LOGO_DATA="logo.jpg";

const REPORT_KEY="takotop_daily_reports_v1";

const MASTER_KEY="takotop_product_master_v1";

let editId=null;

let mode="all";


const $=id=>document.getElementById(id);


const todayISO=()=>new Date().toLocaleDateString("sv-SE");


const yen=n=>"¥"+Number(n||0).toLocaleString("ja-JP");


const load=(k,d)=>{

 try{

  return JSON.parse(
   localStorage.getItem(k)||JSON.stringify(d)
  );

 }catch(e){

  return d;

 }

};


const save=(k,v)=>
 localStorage.setItem(k,JSON.stringify(v));


const reports=()=>
 load(REPORT_KEY,[]);


const masters=()=>
 load(MASTER_KEY,[]);


function toast(s){

 $("toast").textContent=s;

 $("toast").classList.add("show");

 setTimeout(
  ()=>$("toast").classList.remove("show"),
  1700
 );

}


function esc(s){

 return String(s??"").replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[c])
 );

}


function addProduct(name="",qty=1){

 const row=document.createElement("div");

 row.className="product-row";


 const opts=masters()
 .map(m=>`
  <option
   value="${esc(m.name)}"
   ${m.name===name?"selected":""}
  >
   ${esc(m.name)}
  </option>
 `)
 .join("");


 row.innerHTML=`

<select class="pname">

<option value="">
商品を選択
</option>

${opts}

</select>


<div class="qty">

<button
 type="button"
 class="minus"
>
−
</button>

<span>${qty}</span>

<button
 type="button"
 class="plus"
>
＋
</button>

</div>


<input
 class="price"
 type="number"
 readonly
 placeholder="単価"
>


<button
 type="button"
 class="remove"
>
×
</button>

`;


 const sel=row.querySelector(".pname");

 const price=row.querySelector(".price");

 const q=row.querySelector(".qty span");


 function refreshPrice(){

  const m=masters()
   .find(x=>x.name===sel.value);

  price.value=m?m.price:"";

  updateTotal();

 }


 row.querySelector(".minus").onclick=()=>{

  q.textContent=Math.max(
   1,
   +q.textContent-1
  );

  updateTotal();

 };


 row.querySelector(".plus").onclick=()=>{

  q.textContent=+q.textContent+1;

  updateTotal();

 };


 sel.onchange=refreshPrice;


 row.querySelector(".remove").onclick=()=>{

  row.remove();

  if(!document.querySelector(".product-row"))
   addProduct();

  updateTotal();

 };


 $("products").appendChild(row);

 refreshPrice();

}


function getProducts(){

 return [...document.querySelectorAll(".product-row")]
 .map(r=>({

  name:r.querySelector(".pname").value,

  qty:+r.querySelector(".qty span").textContent||0,

  price:+r.querySelector(".price").value||0

 }))
 .filter(x=>x.name);

}


function updateTotal(){

 const total=getProducts()
 .reduce(
  (s,p)=>s+p.qty*p.price,
  0
 );

 $("total").textContent=yen(total);

}


function clearForm(){

 editId=null;

 $("date").value=todayISO();

 $("comment").value="";

 $("products").innerHTML="";

 addProduct();

 updateTotal();

}


function saveReport(){

 const ps=getProducts();

 const date=$("date").value;


 if(!date){

  alert("日付を入力してください。");

  return;

 }


 if(!ps.length){

  alert("商品を1つ以上選択してください。");

  return;

 }


 const sales=ps.reduce(
  (s,p)=>s+p.qty*p.price,
  0
 );


 const arr=reports();


 const item={

  id:editId||Date.now().toString(),

  date,

  sales,

  products:ps,

  comment:$("comment").value.trim(),

  updatedAt:new Date().toISOString()

 };


 if(editId){

  const i=arr.findIndex(
   x=>x.id===editId
  );

  if(i>=0)
   arr[i]=item;

 }else{

  arr.push(item);

 }


 save(REPORT_KEY,arr);

 toast(
  editId
   ?"日報を更新しました"
   :"日報を登録しました"
 );

 clearForm();

 updateToday();

 renderReports();

}


function showView(v){

 ["input","sales","master"]
 .forEach(
  x=>
   $(x+"View").style.display=
    x===v?"block":"none"
 );


 $("navInput")
 .classList.toggle(
  "active",
  v==="input"
 );

 $("navSales")
 .classList.toggle(
  "active",
  v==="sales"
 );

 $("navMaster")
 .classList.toggle(
  "active",
  v==="master"
 );


 if(v==="sales")
  renderReports();

 if(v==="master")
  renderMasters();


 window.scrollTo(0,0);

}


function updateToday(){

 const a=reports()
 .filter(x=>x.date===todayISO());


 $("headerDate").innerHTML=
 new Date().toLocaleDateString(
  "ja-JP",
  {
   month:"long",
   day:"numeric",
   weekday:"short"
  }
 );


 $("todayCount").textContent=
  a.length+"件";


 $("todaySales").textContent=
  yen(
   a.reduce(
    (s,x)=>s+x.sales,
    0
   )
  );


 $("todayQty").textContent=
  a.reduce(
   (s,x)=>
    s+
    x.products.reduce(
     (z,p)=>z+p.qty,
     0
    ),
   0
  )+"個";

}


function setMode(m){

 mode=m;


 ["All","Month","Day"]
 .forEach(
  x=>
   $("tab"+x)
   .classList.toggle(
    "active",
    m===x.toLowerCase()
   )
 );


 $("monthBox").style.display=
  m==="month"?"block":"none";


 $("dayBox").style.display=
  m==="day"?"block":"none";


 renderReports();

}


function filteredReports(){

 let a=reports();


 if(
  mode==="month" &&
  $("month").value
 ){

  a=a.filter(
   x=>x.date.startsWith(
    $("month").value
   )
  );

 }


 if(
  mode==="day" &&
  $("day").value
 ){

  a=a.filter(
   x=>x.date===
   $("day").value
  );

 }


 return a.sort(
  (a,b)=>
   b.date.localeCompare(a.date)
 );

}


function renderReports(){

 const a=filteredReports();


 $("listCount").textContent=
  a.length+"件";


 $("listSales").textContent=
  yen(
   a.reduce(
    (s,x)=>s+x.sales,
    0
   )
  );


 $("listQty").textContent=
  a.reduce(
   (s,x)=>
    s+
    x.products.reduce(
     (z,p)=>z+p.qty,
     0
    ),
   0
  )+"個";


 $("reports").innerHTML=
  a.length

  ?a.map(
   x=>`

<div class="card report">

<div class="report-top">

<span class="report-date">
${esc(x.date)}
</span>

<span class="report-total">
${yen(x.sales)}
</span>

</div>


<div class="chips">

${x.products.map(
 p=>`

<span class="chip">

${esc(p.name)}
× ${p.qty}個
/
${yen(p.price)}

</span>

`
).join("")}

</div>


${
 x.comment
 ?
 `<div class="comment">
 ${esc(x.comment)}
 </div>`
 :
 ""
}


<div class="report-actions">

<button
 class="edit"
 onclick="editReport('${x.id}')"
>
編集
</button>

<button
 class="delete"
 onclick="deleteReport('${x.id}')"
>
削除
</button>

</div>

</div>

`
  ).join("")

  :

  `<div class="empty">
   該当する売上データはありません
  </div>`;

}


function editReport(id){

 const x=reports()
 .find(v=>v.id===id);


 if(!x)
  return;


 editId=id;

 $("date").value=x.date;

 $("comment").value=
  x.comment||"";

 $("products").innerHTML="";


 x.products.forEach(
  p=>addProduct(
   p.name,
   p.qty
  )
 );


 showView("input");

}


function deleteReport(id){

 if(
  !confirm(
   "この日報を削除しますか？"
  )
 )
  return;


 save(
  REPORT_KEY,
  reports().filter(
   x=>x.id!==id
  )
 );


 toast("削除しました");

 renderReports();

 updateToday();

}


function clearSearch(){

 $("month").value="";

 $("day").value="";

 setMode("all");

}


function addMaster(){

 const name=
  $("newProductName")
  .value
  .trim();


 const price=
  Number(
   $("newProductPrice").value
  );


 if(!name){

  alert(
   "商品名を入力してください。"
  );

  return;

 }


 if(
  !Number.isFinite(price) ||
  price<0
 ){

  alert(
   "単価を正しく入力してください。"
  );

  return;

 }


 const arr=masters();


 if(
  arr.some(
   x=>x.name===name
  )
 ){

  alert(
   "同じ商品名がすでに登録されています。"
  );

  return;

 }


 arr.push({
  name,
  price
 });


 arr.sort(
  (a,b)=>
   a.name.localeCompare(
    b.name,
    "ja"
   )
 );


 save(
  MASTER_KEY,
  arr
 );


 $("newProductName").value="";

 $("newProductPrice").value="";


 renderMasters();

 toast(
  "商品を登録しました"
 );

}


function renderMasters(){

 const arr=masters();


 $("masterList").innerHTML=
  arr.length

  ?arr.map(
   (m,i)=>`

<div class="master-item">

<div class="master-name">
${esc(m.name)}
</div>

<div class="master-price">
${yen(m.price)}
</div>

<button
 class="btn danger"
 style="padding:9px 7px"
 onclick="deleteMaster(${i})"
>
削除
</button>

</div>

`
  ).join("")

  :

  `<div class="empty">
   商品がまだ登録されていません
  </div>`;

}


function deleteMaster(i){

 const arr=masters();


 if(
  !confirm(
   "「"+arr[i].name+
   "」を商品マスターから削除しますか？"
  )
 )
  return;


 arr.splice(i,1);


 save(
  MASTER_KEY,
  arr
 );


 renderMasters();

 toast(
  "商品を削除しました"
 );

}


$("month").onchange=renderReports;

$("day").onchange=renderReports;

$("logo").src=LOGO_DATA;


clearForm();

updateToday();

renderMasters();

</script>

</body>
</html>
